<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H5Save 编辑器</title>
  <link rel="stylesheet" href="scrollbars.css?v=21084">
  <style>
    :root {
      color-scheme: light;
      --page: #f4f6f7;
      --surface: #ffffff;
      --surface-2: #eef2f2;
      --ink: #172022;
      --muted: #647174;
      --line: #d7dfe0;
      --accent: #087b72;
      --accent-strong: #06655e;
      --accent-soft: #dff3ef;
      --warning: #a45a0a;
      --warning-soft: #fff1d6;
      --danger: #b43b45;
      --danger-soft: #fde7e9;
      --focus: #2e8dcc;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      letter-spacing: 0;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 38%, transparent); outline-offset: 2px; }

    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      min-height: 68px;
      padding: 12px clamp(16px, 3vw, 36px);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 740; }
    .file-meta { margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 54vw; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .button:hover:not(:disabled) { border-color: #aebabb; background: #f8fafa; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button.primary:hover:not(:disabled) { border-color: var(--accent-strong); background: var(--accent-strong); }
    .button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .button.danger { color: var(--danger); }
    .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .workspace { width: min(1480px, 100%); margin: 0 auto; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .empty-state {
      flex: 1;
      min-height: 520px;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }
    .drop-zone {
      width: min(620px, 100%);
      min-height: 260px;
      border: 1px dashed #9facad;
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 32px;
      text-align: center;
      transition: border-color .15s ease, background .15s ease;
    }
    .drop-zone.dragging { border-color: var(--accent); background: var(--accent-soft); }
    .drop-mark {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--accent);
      font-size: 30px;
      line-height: 1;
      font-family: var(--mono);
    }
    .drop-zone strong { font-size: 18px; }
    .drop-zone p { margin: -7px 0 0; color: var(--muted); }

    .editor-shell { display: none; flex: 1; min-height: 0; }
    .editor-shell.ready { display: flex; flex-direction: column; }
    .summary-band {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .summary-item { min-width: 0; padding: 13px 16px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-item span { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
    .summary-item strong { display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }

    .tabs-band {
      padding: 10px clamp(12px, 2vw, 22px) 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .tabs { display: flex; gap: 4px; overflow-x: auto; }
    .tab {
      min-height: 38px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 7px 13px 8px;
      font-weight: 680;
      white-space: nowrap;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); }

    .panel { display: none; flex: 1; min-height: 0; }
    .panel.active { display: flex; flex-direction: column; }
    .panel-toolbar {
      min-height: 52px;
      padding: 8px clamp(12px, 2vw, 22px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
    .toolbar-note { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 2px; }
    .segment { min-height: 30px; padding: 5px 10px; border: 0; border-radius: 4px; color: var(--muted); background: transparent; font-weight: 650; }
    .segment[aria-pressed="true"] { color: var(--ink); background: var(--surface); box-shadow: 0 1px 2px rgba(16, 35, 37, .12); }

    .overview { padding: clamp(18px, 3vw, 30px); overflow: auto; }
    .section { max-width: 1120px; width: 100%; margin: 0 auto 28px; }
    .section h2 { margin: 0 0 13px; font-size: 15px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 16px; }
    .field { min-width: 0; }
    .field.wide { grid-column: span 2; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .field input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 10px;
    }
    .field input:focus { border-color: var(--focus); }
    .inventory-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
    .inventory-table th, .inventory-table td { border-bottom: 1px solid var(--line); padding: 9px 11px; text-align: left; }
    .inventory-table th { color: var(--muted); font-size: 11px; background: var(--surface-2); }
    .inventory-table tr:last-child td { border-bottom: 0; }
    .inventory-table input { width: 100%; min-width: 80px; height: 32px; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 4px 6px; }
    .inventory-table input:hover, .inventory-table input:focus { border-color: var(--line); background: var(--surface); }

    .code-area-wrap { flex: 1; min-height: 0; position: relative; background: #101719; }
    .code-area {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 18px clamp(14px, 2.4vw, 28px) 60px;
      background: #101719;
      color: #e2eded;
      caret-color: #75d7ca;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }
    .editor-status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 34px;
      padding: 7px clamp(14px, 2.4vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-top: 1px solid #2e3a3c;
      background: #172123;
      color: #9eb0b2;
      font-family: var(--mono);
      font-size: 11px;
      pointer-events: none;
    }
    .valid { color: #72d6a3; }
    .invalid { color: #ff8e96; }

    .route-stats { display: flex; gap: 12px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .route-stats b { color: var(--ink); font-weight: 700; }
    .route-list-warning { color: var(--warning); }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 18px);
      min-width: min(420px, calc(100vw - 28px));
      max-width: 720px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 10px 28px rgba(13, 27, 29, .17);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { border-color: #e5a7ac; background: var(--danger-soft); color: #7f2029; }

    .busy {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(244, 246, 247, .78);
      backdrop-filter: blur(2px);
    }
    .busy.show { display: grid; }
    .busy-box { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-weight: 700; }
    .spinner { width: 19px; height: 19px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .summary-band { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .summary-item:nth-child(3) { border-right: 0; }
      .summary-item:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 10px; }
      .file-meta { max-width: calc(100vw - 32px); }
      .top-actions { width: 100%; justify-content: flex-start; }
      .top-actions .button { flex: 1 1 auto; }
      .summary-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-item:nth-child(2n) { border-right: 0; }
      .summary-item:nth-child(3) { border-right: 1px solid var(--line); }
      .summary-item:nth-child(-n+4) { border-bottom: 1px solid var(--line); }
      .panel-toolbar { align-items: flex-start; flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
      .field.wide { grid-column: span 1; }
      .route-stats { width: 100%; overflow-x: auto; padding-bottom: 2px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>H5Save 编辑器</h1>
        <div class="file-meta" id="fileMeta">未打开文件</div>
      </div>
      <div class="top-actions">
        <label class="button file-button">
          打开文件
          <input id="fileInput" type="file" accept=".h5save,.h5route,.txt,application/octet-stream,text/plain">
        </label>
        <button class="button ghost" id="resetButton" type="button" disabled>恢复原始</button>
        <button class="button" id="jsonExportButton" type="button" disabled>导出 JSON</button>
        <button class="button primary" id="saveButton" type="button" disabled>下载存档</button>
      </div>
    </header>

    <div class="workspace">
      <section class="empty-state" id="emptyState">
        <label class="drop-zone" id="dropZone">
          <span class="drop-mark" aria-hidden="true">+</span>
          <strong>选择或拖入 .h5save 文件</strong>
          <p>文件仅在当前浏览器中处理</p>
          <span class="button primary">选择文件</span>
          <input id="dropFileInput" type="file" accept=".h5save,.h5route,.txt,application/octet-stream,text/plain" hidden>
        </label>
      </section>

      <section class="editor-shell" id="editorShell">
        <div class="summary-band" aria-label="存档摘要">
          <div class="summary-item"><span>游戏</span><strong id="sumName">-</strong></div>
          <div class="summary-item"><span>版本</span><strong id="sumVersion">-</strong></div>
          <div class="summary-item"><span>楼层</span><strong id="sumFloor">-</strong></div>
          <div class="summary-item"><span>生命</span><strong id="sumHp">-</strong></div>
          <div class="summary-item"><span>路线步数</span><strong id="sumRoute">-</strong></div>
          <div class="summary-item"><span>存档时间</span><strong id="sumTime">-</strong></div>
        </div>

        <div class="tabs-band">
          <div class="tabs" role="tablist" aria-label="编辑区域">
            <button class="tab" type="button" role="tab" aria-selected="true" data-panel="overviewPanel">概览编辑</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-panel="jsonPanel">完整 JSON</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-panel="routePanel">路线</button>
          </div>
        </div>

        <section class="panel active" id="overviewPanel" role="tabpanel">
          <div class="overview">
            <div class="section">
              <h2>存档信息</h2>
              <div class="form-grid" id="saveForm"></div>
            </div>
            <div class="section" id="inventorySection">
              <h2>道具与钥匙</h2>
              <table class="inventory-table">
                <thead><tr><th>分类</th><th>标识</th><th>数量</th></tr></thead>
                <tbody id="inventoryBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="panel" id="jsonPanel" role="tabpanel">
          <div class="panel-toolbar">
            <div class="toolbar-note" id="jsonRouteNote">路线字段由“路线”页管理</div>
            <div class="toolbar-group">
              <button class="button" id="formatJsonButton" type="button">格式化</button>
              <button class="button primary" id="applyJsonButton" type="button">应用 JSON</button>
            </div>
          </div>
          <div class="code-area-wrap">
            <textarea class="code-area" id="jsonEditor" aria-label="完整 JSON 编辑器" spellcheck="false" wrap="off"></textarea>
            <div class="editor-status"><span id="jsonStatus">JSON 就绪</span><span id="jsonSize">0 字符</span></div>
          </div>
        </section>

        <section class="panel" id="routePanel" role="tabpanel">
          <div class="panel-toolbar">
            <div class="toolbar-group">
              <div class="segmented" aria-label="路线编辑模式">
                <button class="segment" id="routeSourceMode" type="button" aria-pressed="true">压缩前源码</button>
                <button class="segment" id="routeListMode" type="button" aria-pressed="false">逐步路线</button>
              </div>
              <button class="button" id="copyRouteButton" type="button">复制</button>
            </div>
            <div class="route-stats" id="routeStats"><span>动作 <b>0</b></span><span>移动 <b>0</b></span><span>其他 <b>0</b></span></div>
          </div>
          <div class="code-area-wrap">
            <textarea class="code-area" id="routeEditor" aria-label="路线编辑器" spellcheck="false" wrap="off"></textarea>
            <div class="editor-status"><span id="routeStatus">LZString 已解压</span><span id="routeSize">0 字符</span></div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="busy" id="busy" aria-live="polite"><div class="busy-box"><span class="spinner" aria-hidden="true"></span><span id="busyText">正在处理</span></div></div>

            flushMove();
            lastMove = '';
            output += encodeOne(action);
          }
        }
        flushMove();
        return output;
      }

      function setDirty(value = true) {
        state.dirty = value;
        document.title = `${value ? '* ' : ''}H5Save 编辑器`;
        updateFileMeta();
      }

      function updateFileMeta() {
        if (!state.save) {
          elements.fileMeta.textContent = '未打开文件';
          return;
        }
        const suffix = state.dirty ? ' · 有未下载的修改' : ' · 已解析';
        elements.fileMeta.textContent = `${state.fileName}${suffix}`;
      }

      function timestampLabel(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return String(value ?? '-');
        const date = new Date(number < 100000000000 ? number * 1000 : number);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', { hour12: false });
      }

      function updateSummary() {
        const save = state.save || {};
        const data = save.data || save;
        const hero = data.hero || {};
        $('sumName').textContent = save.name ?? data.name ?? '-';
        $('sumVersion').textContent = save.version ?? data.version ?? '-';
        $('sumFloor').textContent = data.floorId ?? '-';
        $('sumHp').textContent = formatNumber(hero.hp);
        $('sumRoute').textContent = formatNumber(state.routeStats.actions);
        $('sumTime').textContent = timestampLabel(data.time);
      }

      function makeField(label, path, type = 'text', wide = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `field${wide ? ' wide' : ''}`;
        const labelElement = document.createElement('label');
        const input = document.createElement('input');
        const id = `field-${path.join('-')}`;
        labelElement.htmlFor = id;
        labelElement.textContent = label;
        input.id = id;
        input.type = type;
        input.value = getAtPath(state.save, path) ?? '';
        input.addEventListener('change', () => {
          let value = input.value;
          if (type === 'number') value = value === '' ? null : Number(value);
          setAtPath(state.save, path, value);
          setDirty();
          updateSummary();
          refreshJsonUnlessDirty();
        });
        wrapper.append(labelElement, input);
        return wrapper;
      }

      function renderOverview() {
        elements.saveForm.replaceChildren();
        const dataPath = state.save && state.save.data ? ['data'] : [];
        const fields = [
          ['游戏名称', ['name'], 'text', false],
          ['存档版本', ['version'], 'text', false],
          ['当前楼层', dataPath.concat('floorId'), 'text', false],
          ['难度', dataPath.concat('hard'), 'text', false],
          ['角色名', dataPath.concat('hero', 'name'), 'text', false],
          ['等级', dataPath.concat('hero', 'lv'), 'number', false],
          ['生命', dataPath.concat('hero', 'hp'), 'number', false],
          ['魔力', dataPath.concat('hero', 'mana'), 'number', false],
          ['攻击', dataPath.concat('hero', 'atk'), 'number', false],
          ['防御', dataPath.concat('hero', 'def'), 'number', false],
          ['魔防', dataPath.concat('hero', 'mdef'), 'number', false],
          ['金币', dataPath.concat('hero', 'money'), 'number', false],
          ['经验', dataPath.concat('hero', 'exp'), 'number', false],
          ['横坐标', dataPath.concat('hero', 'loc', 'x'), 'number', false],
          ['纵坐标', dataPath.concat('hero', 'loc', 'y'), 'number', false],
          ['朝向', dataPath.concat('hero', 'loc', 'direction'), 'text', false]
        ];
        for (const field of fields) {
          if (getAtPath(state.save, field[1].slice(0, -1)) !== undefined) elements.saveForm.append(makeField(...field));
        }

        elements.inventoryBody.replaceChildren();
        const items = getAtPath(state.save, dataPath.concat('hero', 'items'));
        if (!items || typeof items !== 'object') {
          elements.inventorySection.hidden = true;
          return;
        }
        elements.inventorySection.hidden = false;
        for (const [category, collection] of Object.entries(items)) {
          if (!collection || typeof collection !== 'object' || Array.isArray(collection)) continue;
          for (const [key, value] of Object.entries(collection)) {
            const row = document.createElement('tr');
            const categoryCell = document.createElement('td');
            const keyCell = document.createElement('td');
            const valueCell = document.createElement('td');
            const input = document.createElement('input');
            categoryCell.textContent = category;
            keyCell.textContent = key;
            input.type = typeof value === 'number' ? 'number' : 'text';
            input.value = value;
            input.setAttribute('aria-label', `${category} ${key} 数量`);
            input.addEventListener('change', () => {
              collection[key] = input.type === 'number' ? Number(input.value) : input.value;
              setDirty();
              refreshJsonUnlessDirty();
            });
            valueCell.append(input);
            row.append(categoryCell, keyCell, valueCell);
            elements.inventoryBody.append(row);
          }
        }
      }

      function jsonForEditor() {
        const copy = clone(state.save);
        if (state.routePath) setAtPath(copy, state.routePath, routeMarker);
        return JSON.stringify(copy, null, 2);
      }
      function refreshJsonUnlessDirty() {
        if (state.jsonDirty) return;
        elements.jsonEditor.value = jsonForEditor();
        updateJsonStatus(true);
      }
      function updateJsonStatus(valid = null, message = '') {
        elements.jsonSize.textContent = `${formatNumber(elements.jsonEditor.value.length)} 字符`;
        elements.jsonStatus.className = '';
        if (valid === true) {
          elements.jsonStatus.className = 'valid';
          elements.jsonStatus.textContent = message || 'JSON 有效';
        } else if (valid === false) {
          elements.jsonStatus.className = 'invalid';
          elements.jsonStatus.textContent = message || 'JSON 无效';
        } else elements.jsonStatus.textContent = message || '尚未校验';
      }

      function applyJson(showMessage = true) {
        if (!state.jsonDirty) return true;
        try {
          const parsed = JSON.parse(elements.jsonEditor.value);
          if (state.routePath) setAtPath(parsed, state.routePath, getAtPath(state.save, state.routePath));
          state.save = parsed;
          state.jsonDirty = false;
          setDirty();
          updateJsonStatus(true, 'JSON 已应用');
          renderOverview();
          updateSummary();
          if (showMessage) notify('JSON 修改已应用');
          return true;
        } catch (error) {
          updateJsonStatus(false, error.message);
          if (showMessage) notify(`JSON 无法应用：${error.message}`, true);
          return false;
        }
      }

      function updateRouteStats(stats = state.routeStats) {
        state.routeStats = stats;
        elements.routeStats.innerHTML = `<span>动作 <b>${formatNumber(stats.actions)}</b></span><span>移动 <b>${formatNumber(stats.moves)}</b></span><span>其他 <b>${formatNumber(stats.other)}</b></span>`;
        updateSummary();
      }

      function setRouteSource(source, dirty = false) {
        state.routeSource = source;
        state.routeStats = inspectRoute(source, false).stats;
        state.routeMode = 'source';
        state.listDirty = false;
        state.routeDirty = dirty;
        elements.routeSourceMode.setAttribute('aria-pressed', 'true');
        elements.routeListMode.setAttribute('aria-pressed', 'false');
        elements.routeEditor.value = source;
        elements.routeStatus.textContent = state.routeCompressionLayers ? `LZString 已解压 ${state.routeCompressionLayers} 层` : '路线未压缩';
        elements.routeStatus.className = 'valid';
        elements.routeSize.textContent = `${formatNumber(source.length)} 字符`;
        updateRouteStats(state.routeStats);
      }

      function syncRouteEditor() {
        if (state.routeMode === 'list' && state.listDirty) {
          state.routeSource = encodeRouteActions(elements.routeEditor.value.split(/\r?\n/));
          state.listDirty = false;
          state.routeDirty = true;
          updateRouteStats(inspectRoute(state.routeSource, false).stats);
        } else if (state.routeMode === 'source' && state.routeDirty) {
          state.routeSource = elements.routeEditor.value.trim();
          updateRouteStats(inspectRoute(state.routeSource, false).stats);
        }
      }

      async function switchRouteMode(mode) {
        if (mode === state.routeMode) return;
        if (state.routeMode === 'source') {
          state.routeSource = elements.routeEditor.value.trim();
          state.routeDirty = true;
          const inspection = inspectRoute(state.routeSource, false);
          updateRouteStats(inspection.stats);
          if (inspection.stats.actions > 300000 && !window.confirm(`路线将展开为 ${formatNumber(inspection.stats.actions)} 行，浏览器可能会短暂卡顿。继续吗？`)) return;
          await withBusy('正在展开路线', async () => {
            const expanded = inspectRoute(state.routeSource, true);
            elements.routeEditor.value = expanded.actions.join('\n');
          });
          state.routeMode = 'list';
          state.listDirty = false;
          elements.routeStatus.textContent = '每行一个动作';
        } else {
          syncRouteEditor();
          elements.routeEditor.value = state.routeSource;
          state.routeMode = 'source';
          elements.routeStatus.textContent = 'LZString 压缩前源码';
        }
        elements.routeSourceMode.setAttribute('aria-pressed', String(state.routeMode === 'source'));
        elements.routeListMode.setAttribute('aria-pressed', String(state.routeMode === 'list'));
        elements.routeSize.textContent = `${formatNumber(elements.routeEditor.value.length)} 字符`;
      }

      function renderAll() {
        renderOverview();
        updateSummary();
        elements.jsonEditor.value = jsonForEditor();
        state.jsonDirty = false;
        updateJsonStatus(true);
        elements.emptyState.style.display = 'none';
        elements.editorShell.classList.add('ready');
        elements.resetButton.disabled = false;
        elements.saveButton.disabled = false;
        elements.jsonExportButton.disabled = false;
        updateFileMeta();
      }

      async function parseText(text, fileName, preserveOriginal = true) {
        const input = text.trim();
        if (!input) throw new Error('文件内容为空');
        let jsonText = LZString.decompressFromBase64(input);
        if (!jsonText || !jsonText.trim().startsWith('{')) {
          if (input.startsWith('{')) jsonText = input;
          else throw new Error('外层 LZString 解压失败');
        }
        const save = JSON.parse(jsonText);
        if (!save || typeof save !== 'object' || Array.isArray(save)) throw new Error('存档根节点不是 JSON 对象');
        const routePath = findRoutePath(save);
        let routeSource = '';
        let routeCompressionLayers = 0;
        if (routePath) {
          const routeEncoded = getAtPath(save, routePath);
          routeSource = routeEncoded;
          for (let layer = 0; layer < 8; layer += 1) {
            const decoded = LZString.decompressFromBase64(routeSource);
            if (decoded == null || (decoded === '' && routeSource.length >= 8)) break;
            const recompressed = LZString.compressToBase64(decoded);
            if (recompressed.replace(/=+$/, '') !== routeSource.replace(/=+$/, '')) break;
            routeSource = decoded;
            routeCompressionLayers += 1;
          }
        }
        state.save = save;
        state.routePath = routePath;
        state.routeCompressionLayers = routeCompressionLayers;
        state.fileName = fileName || 'save.h5save';
        if (preserveOriginal) state.originalText = input;
        setRouteSource(routeSource, false);
        setDirty(false);
        renderAll();
        const routeMessage = routePath ? `，路线字段 ${routePath.join('.')} 已解压 ${routeCompressionLayers} 层` : '，未检测到路线字段';
        notify(`存档已打开${routeMessage}`);
      }

      async function openFile(file) {
        if (!file) return;
        await withBusy('正在解析存档', async () => {
          const text = await file.text();
          await parseText(text, file.name, true);
        }).catch(error => notify(`无法打开：${error.message}`, true));
      }

      function prepareSaveObject() {
        if (!applyJson(false)) throw new Error('JSON 存在错误，请先修正');
        syncRouteEditor();
        if (state.routePath) {
          let routeValue = state.routeSource;
          for (let layer = 0; layer < state.routeCompressionLayers; layer += 1) routeValue = LZString.compressToBase64(routeValue);
          setAtPath(state.save, state.routePath, routeValue);
        }
        return state.save;
      }

      function downloadText(text, name, type) {
        const url = URL.createObjectURL(new Blob([text], { type }));
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      function outputName(extension) {
        const base = (state.fileName || 'save').replace(/\.(h5save|h5route|txt|json)$/i, '');
        return `${base}_edited.${extension}`;
      }

      async function exportSave() {
        await withBusy('正在压缩并生成存档', async () => {
          const save = prepareSaveObject();
          const output = LZString.compressToBase64(JSON.stringify(save));
          const check = LZString.decompressFromBase64(output);
          if (!check || JSON.parse(check) == null) throw new Error('导出校验失败');
          downloadText(output, outputName('h5save'), 'text/plain;charset=utf-8');
          setDirty(false);
          notify(`已生成 ${outputName('h5save')}（${formatBytes(output.length)}）`);
        }).catch(error => notify(`下载失败：${error.message}`, true));
      }

      async function exportJson() {
        try {
          const save = clone(prepareSaveObject());
          if (state.routePath) setAtPath(save, state.routePath, state.routeSource);
          downloadText(JSON.stringify(save, null, 2), outputName('json'), 'application/json;charset=utf-8');
          notify('已导出可读 JSON，路线字段为解压后的源码');
        } catch (error) { notify(`导出失败：${error.message}`, true); }
      }

      async function restoreOriginal() {
        if (!state.originalText) return;
        if (state.dirty && !window.confirm('放弃当前修改并恢复刚打开的文件？')) return;
        await withBusy('正在恢复原始存档', () => parseText(state.originalText, state.fileName, false)).catch(error => notify(error.message, true));
      }

      elements.fileInput.addEventListener('change', event => openFile(event.target.files[0]));
      elements.dropFileInput.addEventListener('change', event => openFile(event.target.files[0]));
      for (const eventName of ['dragenter', 'dragover']) {
        elements.dropZone.addEventListener(eventName, event => {
          event.preventDefault();
          elements.dropZone.classList.add('dragging');
        });
      }
      for (const eventName of ['dragleave', 'drop']) {
        elements.dropZone.addEventListener(eventName, event => {
          event.preventDefault();
          elements.dropZone.classList.remove('dragging');
        });
      }
      elements.dropZone.addEventListener('drop', event => openFile(event.dataTransfer.files[0]));

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const current = document.querySelector('.tab[aria-selected="true"]');
          if (current?.dataset.panel === 'jsonPanel' && !applyJson(false)) {
            notify('JSON 有错误，修正后再切换', true);
            return;
          }
          document.querySelectorAll('.tab').forEach(item => item.setAttribute('aria-selected', String(item === tab)));
          document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === tab.dataset.panel));
        });
      });

      elements.jsonEditor.addEventListener('input', () => {
        state.jsonDirty = true;
        setDirty();
        updateJsonStatus(null);
      });
      $('formatJsonButton').addEventListener('click', () => {
        try {
          elements.jsonEditor.value = JSON.stringify(JSON.parse(elements.jsonEditor.value), null, 2);
          state.jsonDirty = true;
          updateJsonStatus(true);
        } catch (error) { updateJsonStatus(false, error.message); }
      });
      $('applyJsonButton').addEventListener('click', () => applyJson(true));

      elements.routeEditor.addEventListener('input', () => {
        if (state.routeMode === 'list') state.listDirty = true;
        else state.routeDirty = true;
        setDirty();
        elements.routeSize.textContent = `${formatNumber(elements.routeEditor.value.length)} 字符`;
        elements.routeStatus.className = '';
        elements.routeStatus.textContent = state.routeMode === 'list' ? '逐步路线已修改' : '源码已修改';
      });
      elements.routeSourceMode.addEventListener('click', () => switchRouteMode('source').catch(error => notify(error.message, true)));
      elements.routeListMode.addEventListener('click', () => switchRouteMode('list').catch(error => notify(error.message, true)));
      $('copyRouteButton').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(elements.routeEditor.value);
          notify('路线已复制');
        } catch (_) {
          elements.routeEditor.select();
          document.execCommand('copy');
          notify('路线已复制');
        }
      });

      elements.resetButton.addEventListener('click', restoreOriginal);
      elements.saveButton.addEventListener('click', exportSave);
      elements.jsonExportButton.addEventListener('click', exportJson);
      window.addEventListener('beforeunload', event => {
        if (!state.dirty) return;
        event.preventDefault();
        event.returnValue = '';
      });
    })();
  </script>
</body>
</html>
